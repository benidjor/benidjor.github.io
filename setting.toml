# girok.md Configuration File
# Knowledge becomes a map when shared.

# === Core ===
source_root_path = "/Users/aryijq/Documents/obsidian-vault"
blog_name = "benidjor's devlog"
site_url = "https://benidjor.github.io"
locale = "ko"

# === Intro (homepage hero) ===
[intro]
greeting = "안녕하세요,"
name = "benidjor"
name_suffix = " 입니다."
role = "Data Engineer"
description = """당장의 효율보다, 끝까지 파고들어 답을 찾고 기록합니다.
데이터 엔지니어로 성장하기 위한 학습과 회고."""
intro_tags = ["Spark", "Airflow", "Kafka", "Iceberg", "Trino", "Snowflake"]

# === Posts ===
[posts]
# Safety: posts tagged with these are excluded from sync
# even if publish: true is set.
exclude_tags = ["private", "draft", "personal"]

[posts.translate]
enabled = false

# === Categories ===
[categories]
order = ["projects", "til"]

[categories.projects]
label_ko = "Projects"
label_en = "Projects"
description_ko = "데이터 엔지니어링 실무 / 사이드 프로젝트 시리즈."
description_en = "Data engineering work and side-project series."

[categories.til]
label_ko = "TIL"
label_en = "TIL"
description_ko = "오늘 배운 것 — 짧은 호흡의 학습 기록."
description_en = "Today I learned — short, frequent learning notes."

# === Comments (Giscus) ===
[comments]
enabled = true
provider = "giscus"

[comments.giscus]
repo = "benidjor/benidjor.github.io"
repo_id = "R_kgDOMiFp9A"
category = "Comments"
category_id = "DIC_kwDOMiFp9M4C8QXo"
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "top"
theme = "preferred_color_scheme"
lang = "ko"

# === Analytics (GoatCounter) ===
[analytics]
enabled = true
provider = "goatcounter"

[analytics.goatcounter]
site_code = "benidjor"
show_view_count = true
